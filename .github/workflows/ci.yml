name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run collagen API smoke test
        run: npm run test:collagen-api

      - name: Run local stack smoke test
        run: npm run test:local-stack

      - name: Run database backup restore smoke test
        run: npm run test:db-backup-restore

      - name: Build
        run: npm run build

      - name: Run deploy preflight check
        run: npm run check:deploy
